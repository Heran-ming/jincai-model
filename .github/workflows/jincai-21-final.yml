name: jincai-21-final

on:
  schedule:
    # 21:05 Asia/Shanghai == 13:05 UTC
    - cron: "5 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENAI_MODEL: gpt-5.5
      OPENAI_REASONING_EFFORT: high
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate 21:00 final record
        env:
          TZ: Asia/Shanghai
        run: python scripts/generate_21_final.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records/21_final/*.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update 21 final record"
          git push

      - name: Notify Telegram
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not configured. Skip notification."
            exit 0
          fi
          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          WORKFLOW="${{ github.workflow }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="[$REPO] $WORKFLOW: $STATUS%0A$RUN_URL"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MSG}" \
            -d disable_web_page_preview=true
          REPORT_PATH="$(ls -1 extracted/竞彩/赔率复查报告-*-2100.md 2>/dev/null | sort | tail -n1)"
          echo "Resolved source report path: ${REPORT_PATH}"
          if [ -f "${REPORT_PATH}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@"${REPORT_PATH}" \
              -F caption="21点赔率复查（源文件）"
          else
            echo "Source report file not found: ${REPORT_PATH}"
          fi
