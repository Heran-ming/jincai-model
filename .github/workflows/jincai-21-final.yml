name: jincai-21-final

on:
  schedule:
    # 21:05 Asia/Shanghai == 13:05 UTC
    - cron: "5 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENAI_MODEL: gpt-5.5
      OPENAI_REASONING_EFFORT: high
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate 21:00 final record
        env:
          TZ: Asia/Shanghai
        run: python scripts/generate_21_final.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records/21_final/*.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update 21 final record"
          git push
