name: jincai-21-final

on:
  schedule:
    # 21:05 Asia/Shanghai == 13:05 UTC
    - cron: "5 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: deepseek
      DEEPSEEK_MODEL: deepseek-v4-flash
      DEEPSEEK_THINKING: enabled
      DEEPSEEK_REASONING_EFFORT: high
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      JINCAI_SEARCH_PROVIDER: auto
      JINCAI_SEARCH_MAX_QUERIES: "16"
      JINCAI_SEARCH_RESULTS_PER_QUERY: "4"
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate 21:05 final record
        env:
          TZ: Asia/Shanghai
        run: |
          python scripts/generate_21_final.py
          python scripts/update_portfolio_status.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records/21_final/*.md records/portfolio_status.md records/odds_snapshots records/odds_store
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update 21 final record"
          git push

