name: jincai-17-check

on:
  schedule:
    # 17:00 Asia/Shanghai == 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENAI_MODEL: gpt-5.4
      OPENAI_REASONING_EFFORT: high
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate 17:00 check record
        env:
          TZ: Asia/Shanghai
          JINCAI_OUTPUT_DIR: "17_check"
          JINCAI_BATCH_LABEL: "17点复查方案"
          JINCAI_NEXT_RECHECK_LABEL: "21点最终复查项（模板）"
          JINCAI_WORKFLOW_FILE: ".github/workflows/jincai-17-initial.yml"
        run: python scripts/generate_17_initial.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records/17_check/*.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update 17 check record"
          git push

      - name: Notify Telegram
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not configured. Skip notification."
            exit 0
          fi
          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          WORKFLOW="${{ github.workflow }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="[$REPO] $WORKFLOW: $STATUS%0A$RUN_URL"
          MESSAGE_RESPONSE="$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MSG}" \
            -d disable_web_page_preview=true)"
          echo "Telegram sendMessage response: ${MESSAGE_RESPONSE}"
          if [ -f records/17_check/.latest_path ]; then
            REPORT_PATH="$(cat records/17_check/.latest_path)"
          else
            REPORT_PATH="$(ls -1 records/17_check/*.md 2>/dev/null | sort | tail -n1)"
          fi
          echo "Resolved report path: ${REPORT_PATH}"
          if [ -f "${REPORT_PATH}" ]; then
            DOCUMENT_RESPONSE="$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@"${REPORT_PATH}" \
              -F caption="17点复查结果文件")"
            echo "Telegram sendDocument response: ${DOCUMENT_RESPONSE}"
          else
            echo "Report file not found: ${REPORT_PATH}"
          fi
