name: jincai-17-check

on:
  schedule:
    # 17:00 Asia/Shanghai == 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: deepseek
      DEEPSEEK_MODEL: deepseek-v4-flash
      DEEPSEEK_THINKING: enabled
      DEEPSEEK_REASONING_EFFORT: high
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      JINCAI_SEARCH_PROVIDER: auto
      JINCAI_SEARCH_MAX_QUERIES: "16"
      JINCAI_SEARCH_RESULTS_PER_QUERY: "4"
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate 17:00 check record
        env:
          TZ: Asia/Shanghai
          JINCAI_OUTPUT_DIR: "17_check"
          JINCAI_BATCH_LABEL: "17:00 check plan"
          JINCAI_NEXT_RECHECK_LABEL: "21:05 final recheck items"
          JINCAI_WORKFLOW_FILE: ".github/workflows/jincai-17-initial.yml"
        run: python scripts/generate_17_initial.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records/17_check/*.md records/odds_snapshots
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update 17 check record"
          git push

