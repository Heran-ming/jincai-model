name: jincai-daily-review

on:
  schedule:
    # 09:00 Asia/Shanghai == 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: deepseek
      DEEPSEEK_MODEL: deepseek-v4-flash
      DEEPSEEK_THINKING: enabled
      DEEPSEEK_REASONING_EFFORT: high
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      JINCAI_SEARCH_PROVIDER: auto
      JINCAI_SEARCH_MAX_QUERIES: "8"
      JINCAI_SEARCH_RESULTS_PER_QUERY: "4"
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily review record
        env:
          TZ: Asia/Shanghai
        run: |
          python scripts/generate_daily_review.py
          python scripts/update_portfolio_status.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records/reviews/*.md records/portfolio_status.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update daily review record"
          git push

      - name: Notify Telegram
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not configured. Skip notification."
            exit 0
          fi
          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          WORKFLOW="${{ github.workflow }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="[$REPO] $WORKFLOW: $STATUS%0A$RUN_URL"
          MESSAGE_RESPONSE="$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MSG}" \
            -d disable_web_page_preview=true)"
          echo "Telegram sendMessage response: ${MESSAGE_RESPONSE}"
          if [ -f records/reviews/.latest_path ]; then
            REPORT_PATH="$(cat records/reviews/.latest_path)"
          else
            REPORT_PATH="$(ls -1 records/reviews/*.md 2>/dev/null | sort | tail -n1)"
          fi
          echo "Resolved report path: ${REPORT_PATH}"
          if [ -f "${REPORT_PATH}" ]; then
            DOCUMENT_RESPONSE="$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@"${REPORT_PATH}" \
              -F caption="早间复盘结果文件")"
            echo "Telegram sendDocument response: ${DOCUMENT_RESPONSE}"
          else
            echo "Report file not found: ${REPORT_PATH}"
          fi
